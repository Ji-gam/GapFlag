<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gap &amp; Flag</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; line-height: 1.5; }
  a { color: #2563eb; }
  .muted { color: #9ca3af; }
  h1 { margin-top: 0.25rem; }
  h1, h2 { line-height: 1.3; }
  .card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; }
  .card.null { background: #f3f4f6; color: #9ca3af; }
  .disclaimer { margin-top: 2rem; padding-top: 1rem; border-top: 1px solid #e5e7eb; font-size: 0.85rem; color: #6b7280; }
  input, select, button { font-size: 1rem; padding: 0.4rem; }
  table { border-collapse: collapse; width: 100%; margin: 0.75rem 0 1.25rem; font-size: 0.9rem; }
  th, td { border: 1px solid #e5e7eb; padding: 0.4rem 0.6rem; text-align: left; vertical-align: top; }
  th { background: #f9fafb; }
  code { background: #f3f4f6; padding: 0.1rem 0.3rem; border-radius: 4px; }

  .site-header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.4rem 1rem; padding-bottom: 0.75rem; margin-bottom: 1.25rem; border-bottom: 1px solid #e5e7eb; }
  .site-header .brand { font-weight: 700; color: #1a1a1a; text-decoration: none; margin-right: 0.25rem; }
  .site-header nav { display: flex; gap: 0.9rem; font-size: 0.9rem; }

  .score-summary { display: flex; flex-wrap: wrap; gap: 0.75rem; margin: 1rem 0 1.5rem; }
  .score-box { flex: 1 1 200px; border: 1px solid #e5e7eb; border-radius: 8px; padding: 0.75rem 1rem; }
  .score-box.null { background: #f3f4f6; }
  .score-box .score-label { font-size: 0.85rem; color: #6b7280; }
  .score-box .score-value { font-size: 1.6rem; font-weight: 700; }
  .score-box .score-value.null { color: #9ca3af; font-size: 1.1rem; font-weight: 400; }
  .coverage-badge { display: inline-block; margin-top: 0.25rem; font-size: 0.8rem; padding: 0.1rem 0.45rem; border-radius: 999px; background: #eef2ff; color: #3730a3; }
</style>
</head>
<body>
<header class="site-header">
  <a class="brand" href="/">Gap &amp; Flag</a>
  <nav>
    <a href="/">검색</a>
    <a href="/matrix">매트릭스</a>
    <a href="/about">산식·데이터 출처</a>
  </nav>
</header>
{% block content %}{% endblock %}
<div class="disclaimer">본 도구는 참고용이며 의료·규제 판단을 대신하지 않습니다.</div>
</body>
</html>
